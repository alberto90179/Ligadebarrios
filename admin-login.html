<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Administrador - Liga Municipal de Fut7</title>
    <link rel="icon" type="image/png" href="logo_liga.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="navbar">
        <div class="logo-container">
            <img src="logo liga de barrios.PNG" alt="Logo Liga" class="logo-img">
            <h1 class="site-title">Liga Municipal de<br><span>Fut7 de Barrios</span></h1>
        </div>
        <nav class="nav-links">
            <ul>
                <li><a href="index.html"><i class="fas fa-arrow-left"></i> Volver al sitio</a></li>
            </ul>
        </nav>
    </header>

    <main class="login-main">
        <div class="login-card card">
            <h2 class="card-title text-center"><i class="fas fa-lock"></i> Acceso Administrativo</h2>
            <form id="login-form" class="admin-form">
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" name="username" placeholder="Ingresa tu usuario" required>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required>
                </div>
                <p id="login-error" class="error-msg" style="display: none;">Usuario o contraseña incorrectos.</p>
                <button type="submit" class="btn-ver-resultados" style="width: 100%; margin-top: 10px;">
                    Iniciar Sesión <i class="fas fa-sign-in-alt"></i>
                </button>
            </form>
        </div>
    </main>

    <script src="admin.js"></script>
</body>
</html>
